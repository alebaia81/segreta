# ─────────────────────────────────────────────────────────────────────────────
# wrangler.toml — Segreta Style
# Cloudflare Pages + Pages Functions configuration
#
# Documentazione: https://developers.cloudflare.com/pages/configuration/
# ─────────────────────────────────────────────────────────────────────────────

name               = "segreta"
compatibility_date = "2024-09-23"
pages_build_output_dir = "./dist"

# ─── Build ───────────────────────────────────────────────────────────────────
[build]
command = "npm run build"

# ─── Variabili d'ambiente (production) ───────────────────────────────────────
# IMPORTANTE: le variabili sensibili (SUPABASE_SECRET_KEY, ecc.) vanno
# configurate nella dashboard Cloudflare Pages → Settings → Environment variables
# NON metterle qui in chiaro.
[vars]
ENVIRONMENT = "production"

# ─── Header HTTP ─────────────────────────────────────────────────────────────
# Cloudflare Pages legge il file public/_headers (più portabile).
#
# STRATEGIA DI CACHE:
#
#  /index.html
#    Cache-Control: no-cache, no-store, must-revalidate
#
#  /assets/* (JS/CSS hashati da Vite)
#    Cache-Control: public, max-age=31536000, immutable
#
#  /greta.jpg, /logo.png, /boutique_bg.png (asset statici senza hash)
#    Cache-Control: public, max-age=86400, stale-while-revalidate=3600
#
#  /api/* (Pages Functions — serverless)
#    Cache-Control: no-store
